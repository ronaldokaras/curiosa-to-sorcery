<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSV Converter</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Botões de idioma fixos no canto superior direito -->
  <div class="lang-buttons">
    <button class="btn-lang" id="langPt" data-lang="pt">🇧🇷 PT</button>
    <button class="btn-lang" id="langEn" data-lang="en">🇬🇧 EN</button>
  </div>

  <div class="app">
    <!-- Cabeçalho -->
    <header>
      <span class="badge" data-i18n="badge">Ferramenta da comunidade</span>
      <h1 data-i18n="app.title">CSV Converter</h1>
    </header>

    <!-- Grid com dois cards lado a lado -->
    <div class="cards-row">
      <!-- Card 1: Arquivo -->
      <section class="card">
        <div class="card-header">
          <span class="num">1</span> <span data-i18n="upload.title">ARQUIVO DO CURIOSA</span>
        </div>
        <div class="dropzone" id="dropzone">
          <span class="icon">📄</span>
          <span class="label" data-i18n="upload.label"><strong>Arraste o CSV</strong> ou clique para selecionar</span>
          <span class="filename" id="filename"></span>
        </div>
        <input type="file" id="fileInput" accept=".csv,text/csv" />
      </section>

      <!-- Card 2: Modo -->
      <section class="card">
        <div class="card-header">
          <span class="num">2</span> <span data-i18n="mode.title">MODO DE CONVERSÃO</span>
        </div>
        <div class="options">
          <label class="option">
            <input type="radio" name="modo" value="minhas" checked />
            <div>
              <strong data-i18n="mode.option1.label">Só as cartas que eu tenho</strong>
              <span data-i18n="mode.option1.desc">Gera apenas as cartas do seu CSV. Enriquece com dados dos sets quando possível. Recomendado para importar.</span>
            </div>
          </label>
          <label class="option">
            <input type="radio" name="modo" value="completos" />
            <div>
              <strong data-i18n="mode.option2.label">Sets completos</strong>
              <span data-i18n="mode.option2.desc">Mantém todas as cartas das bases e atualiza as quantidades das que você possui.</span>
            </div>
          </label>
        </div>
      </section>
    </div>

    <!-- Card 3: Conversão -->
    <section class="card convert-card">
      <button class="btn btn-primary" id="btnConvert" disabled data-i18n="convert.button">Converter CSV</button>

      <div class="results" id="resultArea">
        <div class="stats" id="stats"></div>
        <div class="log" id="log"></div>
        <button class="btn btn-success" id="btnDownload" style="display:none;" data-i18n="download.button">Baixar ligaSorcery.csv</button>
      </div>
    </section>

    <!-- Rodapé -->
    <footer>
      <p data-i18n="footer.text">Feito para a comunidade Sorcery BR</p>
      <div class="links">
        <a href="https://curiosa.io" target="_blank" rel="noopener">curiosa.io</a>
        <a href="https://sorcery.com.br" target="_blank" rel="noopener">sorcery.com.br</a>
        <a href="#" id="recarregarSets" data-i18n="footer.reload">Recarregar bases</a>
      </div>
    </footer>
  </div>

  <!-- Carrega os scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>

  <!-- Configura os botões de idioma manualmente (garantia) -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      document.getElementById('langPt').addEventListener('click', function() {
        if (window.setLanguage) window.setLanguage('pt');
      });
      document.getElementById('langEn').addEventListener('click', function() {
        if (window.setLanguage) window.setLanguage('en');
      });
    });
  </script>
</body>
</html>
