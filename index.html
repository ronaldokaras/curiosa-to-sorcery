<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor Curiosa → Liga Sorcery</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="badge">Ferramenta da comunidade</div>
      <h1>Curiosa → Liga Sorcery</h1>
      <p>
        Converte o CSV do <a href="https://curiosa.io" target="_blank" rel="noopener">curiosa.io</a>
        para o formato usado na Liga / <a href="https://sorcery.com.br" target="_blank" rel="noopener">sorcery.com.br</a>
      </p>
    </header>

    <!-- Step 1 -->
    <section class="card">
      <div class="card-title"><span class="num">1</span> Arquivo do Curiosa</div>
      <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-label">
          <strong>Arraste o CSV</strong> ou clique para selecionar
        </div>
        <div class="dropzone-filename" id="filename"></div>
      </div>
      <input type="file" id="fileInput" accept=".csv,text/csv" />
    </section>

    <!-- Step 2 -->
    <section class="card">
      <div class="card-title"><span class="num">2</span> Modo de conversão</div>
      <div class="options">
        <label class="option">
          <input type="radio" name="modo" value="simples" checked />
          <div class="option-text">
            <strong>Simples</strong>
            <span>Gera apenas as cartas do seu CSV. Rápido e suficiente na maioria dos casos.</span>
          </div>
        </label>
        <label class="option">
          <input type="radio" name="modo" value="completo" />
          <div class="option-text">
            <strong>Completo</strong>
            <span>Enriquece com raridade, cor, número e dados dos sets oficiais (quando disponíveis).</span>
          </div>
        </label>
      </div>
    </section>

    <!-- Step 3 -->
    <section class="card">
      <div class="card-title"><span class="num">3</span> Converter</div>
      <button class="btn btn-primary" id="btnConvert" disabled>Converter CSV</button>

      <div class="results" id="resultArea">
        <div class="stats" id="stats"></div>
        <div class="log" id="log"></div>
        <button class="btn btn-success" id="btnDownload">Baixar ligaSorcery.csv</button>
      </div>
    </section>

    <footer class="footer">
      Feito para a comunidade Sorcery BR
      <div class="footer-links">
        <a href="https://curiosa.io" target="_blank" rel="noopener">curiosa.io</a>
        <a href="https://sorcery.com.br" target="_blank" rel="noopener">sorcery.com.br</a>
        <a href="#" id="recarregarSets">Recarregar bases</a>
      </div>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
